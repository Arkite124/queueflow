name: QueueFlow CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: queueflow_test
          POSTGRES_USER: queueflow_test
          POSTGRES_PASSWORD: isolated_test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U queueflow_test -d queueflow_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://queueflow_test:isolated_test_only@localhost:5432/queueflow_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend worker shared scripts tests
      - run: python -m scripts.audit_python
      - run: pytest -v --junitxml=output/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: output/pytest.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.test.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
