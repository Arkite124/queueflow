name: queueflow-tests
services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: queueflow_test
      POSTGRES_USER: queueflow_test
      POSTGRES_PASSWORD: isolated_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow_test -d queueflow_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-test:
    image: redis:7.4.6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://queueflow_test:isolated_test_only@postgres-test:5432/queueflow_test
      TEST_REDIS_URL: redis://redis-test:6379/0
    depends_on:
      postgres-test: {condition: service_healthy}
      redis-test: {condition: service_healthy}
